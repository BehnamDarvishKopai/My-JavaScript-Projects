<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Navigation with Dropdowns</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <!-- ===== HTML BODY ===== -->
    <div class="card">
      <h2> درصد تست‌ها</h2>

      <!-- فرم شامل سه ورودی و یک باتن -->
      <form id="testForm">
        <div class="form-group">
          <label for="totalTests"> تعداد کل تست‌ها</label>
          <input
            type="number"
            id="totalTests"
            placeholder="for example : 15"
            value="20"
            min="0"
          />
        </div>

        <div class="form-group">
          <label for="correctTests"> تعداد تست‌های درست</label>
          <input
            type="number"
            id="correctTests"
            placeholder="for example : 15"
            value="14"
            min="0"
          />
        </div>

        <div class="form-group">
          <label for="wrongTests"> تعداد تست‌های غلط</label>
          <input
            type="number"
            id="wrongTests"
            placeholder="for example : 5"
            value="6"
            min="0"
          />
        </div>

        <button type="button" class="btn" id="calcBtn">محاسبه درصد</button>
      </form>

      <!-- نمایش نتیجه درصد -->
      <div class="result-box" id="resultDisplay">
        <p>درصد تست‌های درست</p>
        <div class="percent" id="percentValue">۰٪</div>
        <p style="font-size: 0.9rem; color: #334155" id="detailInfo">
          ( از مجموع تست‌ها )
        </p>
      </div>
    </div>

   

    <!-- ===== JAVA SCRIPT SOURCE ===== -->
    <script src="../JavaScript/index.js"></script>
  </body>
</html>
